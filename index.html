<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>DealD — เปรียบเทียบราคา ง่าย ๆ</title>
  <meta name="description" content="DealD เว็บแอปเปรียบเทียบราคาต่อหน่วยแบบง่าย ๆ กรอกราคาและจำนวนหน่วย แล้วดูว่าแบบไหนคุ้มกว่า ใช้งานฟรี ไม่ต้องสมัครสมาชิก">

  <meta name="theme-color" content="#011a4f">
  <meta name="color-scheme" content="light">

  <!-- PWA / iOS -->
  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DealD">
  <meta name="format-detection" content="telephone=no">

  <link rel="icon" href="./assets/icons/favicon-16-v2.png" sizes="16x16" type="image/png">
  <link rel="icon" href="./assets/icons/favicon-32-v2.png" sizes="32x32" type="image/png">
  <link rel="icon" href="./assets/icons/favicon-48-v2.png" sizes="48x48" type="image/png">
  <link rel="icon" href="./assets/icons/favicon-64.png" sizes="64x64" type="image/png">

  <!-- apple-touch-icon: ไฟล์หลักวางไว้ที่ root ของแอปตามชื่อมาตรฐาน
       เผื่อ Safari ไปค้นเองโดยไม่อ่าน link tag -->
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="167x167" href="./assets/icons/apple-touch-icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="./assets/icons/apple-touch-icon-152.png">

  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <header class="header">
    <img class="brand-logo" src="./assets/icons/logo-rounded-96-v2.png"
         alt="DealD" width="26" height="26" decoding="async">
    <h1 class="brand-title">เปรียบเทียบราคา ง่าย ๆ</h1>
  </header>

  <main class="container">

    <form id="compare-form" novalidate>

      <div class="control">
        <label class="control-label" for="count">เปรียบเทียบราคา</label>
        <div class="select-wrap">
          <select id="count" name="count" class="select" aria-describedby="count-suffix">
            <option value="2" selected>2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </div>
        <span class="control-suffix" id="count-suffix">แบบ</span>
      </div>

      <div class="table">
        <div class="table-head" aria-hidden="true">
          <span></span>
          <span>ราคา</span>
          <span>จำนวนหน่วย</span>
          <span>ราคาต่อหน่วย</span>
        </div>
        <!-- แถวของแต่ละแบบ ถูกสร้างด้วย JavaScript -->
        <div id="items" class="items"></div>
      </div>

      <p id="form-error" class="form-error" role="alert" hidden></p>

      <div class="actions">
        <button type="button" id="btn-reset" class="btn btn-secondary">ล้าง</button>
        <button type="submit" id="btn-calc" class="btn btn-primary">คำนวณ</button>
      </div>

    </form>

    <section id="result" class="result-card" aria-labelledby="result-title" tabindex="-1">
      <h2 id="result-title" class="result-title">สรุป</h2>
      <p id="result-headline" class="result-headline"></p>
      <dl id="result-rows" class="result-rows"></dl>
      <p id="result-sentence" class="result-sentence"></p>
    </section>

    <noscript>
      <p class="noscript">DealD ต้องเปิดใช้งาน JavaScript จึงจะคำนวณได้ กรุณาเปิด JavaScript ในเบราว์เซอร์ของคุณ</p>
    </noscript>

  </main>

  <script src="./script.js" defer></script>
</body>
</html>
